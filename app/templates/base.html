<!-- templates/base.html -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Eventos Tec{% endblock %}</title>

    <!-- Toastify CSS (vendor: toastify-js 1.12.0) -->
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='vendor/css/toastify.css') }}"
    />

    <!-- Tailwind CSS precompilado (npm run build:static -> app/static/css/
         tailwind.css, no versionado). LOCAL y bloqueante a propósito: es lo
         que evita el FOUC. El antiguo CDN (~400 KB de JS que compilaba en el
         navegador) dejaba la página en blanco en red lenta y, en defer, la
         pintaba sin estilos. -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.css') }}"
    />

    <!-- Google Sans (OFL, oficial de Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Tabler Icons (vendor: @tabler/icons-webfont 2.47.0, la versión cuyo
         CSS es byte-idéntico al que servía el CDN) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='vendor/tabler/tabler-icons.min.css') }}"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='favicon.svg') }}"
    />

    <!-- Alpine.js (vendor: alpinejs 3.17.4). Sigue con `defer`: no bloquea el
         pintado y debe ejecutarse después del parseo (Alpine inicializa
         x-data de las plantillas). -->
    <script
      defer
      src="{{ url_for('static', filename='vendor/js/alpine.min.js') }}"
    ></script>

    <!-- Day.js (vendor: dayjs 1.11.23). Bloqueantes y locales: ~13 KB y la
         init inline de abajo depende de que dayjs exista al ejecutarse. -->
    <script src="{{ url_for('static', filename='vendor/js/dayjs.min.js') }}"></script>
    <!-- Plugin para formato localizado en español -->
    <script src="{{ url_for('static', filename='vendor/js/dayjs.locale.es.js') }}"></script>
    <!-- Plugin duration (necesario para dayjs.duration) -->
    <script src="{{ url_for('static', filename='vendor/js/dayjs.plugin.duration.js') }}"></script>
    <script>
      if (typeof dayjs !== "undefined" && dayjs && dayjs.extend) {
        try {
          dayjs.extend(window.dayjs_plugin_duration || dayjs_plugin_duration);
          // set locale to es globally
          dayjs.locale("es");
        } catch (e) {
          /* ignore if plugin missing */
          console.error("dayjs duration plugin load error", e);
        }
      }
    </script>

    <!-- Custom styles -->
    <style>
      /* Fuente global. El preflight de tailwind.css ya la trae (viene de
         tailwind.config.js); esta regla la garantiza aunque ese CSS no llegue
         a cargarse. */
      html,
      body {
        font-family:
          "Google Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      [x-cloak] {
        display: none !important;
      }

      .toast-success {
        box-shadow:
          0 4px 6px -1px rgba(16, 185, 129, 0.2),
          0 2px 4px -1px rgba(16, 185, 129, 0.1);
      }

      .toast-error {
        box-shadow:
          0 4px 6px -1px rgba(239, 68, 68, 0.2),
          0 2px 4px -1px rgba(239, 68, 68, 0.1);
      }

      .toast-warning {
        box-shadow:
          0 4px 6px -1px rgba(245, 158, 11, 0.2),
          0 2px 4px -1px rgba(245, 158, 11, 0.1);
      }

      .toast-info {
        box-shadow:
          0 4px 6px -1px rgba(59, 130, 246, 0.2),
          0 2px 4px -1px rgba(59, 130, 246, 0.1);
      }

      .toastify {
        display: flex;
        align-items: center;
      }

      /* Colorea los controles nativos (checkbox/radio) para que sigan la paleta indigo */
      input[type="checkbox"],
      input[type="radio"] {
        accent-color: #4f46e5; /* indigo-600 */
      }

      /* Mejorar indicador de foco para accesibilidad */
      input[type="checkbox"]:focus,
      input[type="radio"]:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); /* indigo-600 a 15% */
        border-radius: 0.25rem;
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body class="bg-gray-50">
    {% block content %}{% endblock %}

    <!-- Toastify JS (vendor: toastify-js 1.12.0) -->
    <script
      type="text/javascript"
      src="{{ url_for('static', filename='vendor/js/toastify.js') }}"
    ></script>
    <!-- JS -->
    <script src="{{ url_for('static', filename='js/helpers/dateHelpers.js') }}"></script>
    <script src="{{ url_for('static', filename='js/helpers/activityTypeHelpers.js') }}"></script>
    <script src="{{ url_for('static', filename='js/helpers/registrationStatus.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
