services:
  web:
    build: .
    # Map that host port to the container's gunicorn port (8000).
    ports:
      - "8092:8000"
    volumes:
      # - .:/app:cached # Uncomment for local development with live code reloading
      - ./instance:/app/instance
    # Use an env_file (./.env) or environment on the host to provide secrets and DB connection data.
    # Create a local .env (not committed) with the DB credentials or export the variables in the host environment.
    env_file:
      - .env
    environment:
      # FLASK_ENV está deprecado en Flask 3 (no cambia la config); se conserva
      # por compatibilidad, pero la config real la decide FLASK_CONFIG.
      - FLASK_ENV=production
      - FLASK_APP=run.py
      # En el contenedor corremos ProductionConfig (DEBUG=False). El .env trae
      # FLASK_CONFIG=development para `python run.py` en local; esta sección
      # tiene prioridad sobre env_file, así el contenedor queda en production.
      - FLASK_CONFIG=production
      # DB configuration read by config.py (it prefers DATABASE_URL, else builds from DB_* vars)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Máximo 10 MB por archivo de log
        max-file: "3" # Conservar solo los últimos 3 archivos
